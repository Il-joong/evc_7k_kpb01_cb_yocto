---
header:
  version: 17
  includes:
    - kas/templates/bblayers.conf.yml
    - kas/templates/local-arago64-v3.conf.yml

target: tisdk-default-image

repos:
  bitbake:
    url: "https://git.openembedded.org/bitbake"
    branch: "master"
    path: "sources/bitbake"
    layers:
      .: disabled

  meta-arago:
    url: "https://git.yoctoproject.org/meta-arago"
    branch: "master"
    path: "sources/meta-arago"
    layers:
      meta-arago-distro:
      meta-arago-extras:
      meta-arago-test:

  meta-flutter:
    url: "https://github.com/meta-flutter/meta-flutter.git"
    branch: "master"
    path: "sources/meta-flutter"
    layers:
      .:
      meta-flutter-apps:

  meta-qt6:
    url: "https://code.qt.io/yocto/meta-qt6.git"
    branch: "dev"
    path: "sources/meta-qt6"

  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
    branch: "master"
    commit: "f505ae07df8d8350b715fe20bdacfe3bcf1bf8c6"
    path: "sources/meta-virtualization"

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: "master"
    path: "sources/meta-openembedded"
    layers:
      meta-networking:
      meta-python:
      meta-oe:
      meta-gnome:
      meta-filesystems:
      meta-multimedia:

  meta-ti:
    url: "https://git.yoctoproject.org/meta-ti"
    branch: "master"
    path: "sources/meta-ti"
    layers:
      meta-ti-extras:
      meta-beagle:
      meta-ti-bsp:

  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm"
    branch: "master"
    commit: "f4118f9b86742faa9fb649e58da3e00e45375645"
    path: "sources/meta-arm"
    layers:
      meta-arm:
      meta-arm-toolchain:

  oe-core:
    url: "https://git.openembedded.org/openembedded-core"
    branch: "master"
    commit: "2dc4d2f8b5c7a6e87291385fb860436593767199"
    path: "sources/oe-core"
    layers:
      meta:
